<!-- AI生成 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>智场通 SmartVenue · 整站预览</title>
<style>
:root{
  --primary:#1677FF;--primary-end:#3B82F6;--primary-light:#E6F4FF;
  --success:#00B96B;--success-light:#E6FFFB;--warning:#FA8C16;--danger:#FF4D4F;
  --text:#1D2129;--text2:#4E5969;--text3:#86909C;--bg:#F6F8FB;--card:#fff;
  --ease-enter:cubic-bezier(.22,1,.36,1);--ease-move:cubic-bezier(.25,1,.5,1);
  --ease-press:cubic-bezier(.25,.46,.45,.94);
}
*{box-sizing:border-box;margin:0;padding:0}
button,input{font:inherit}
button{cursor:pointer;border:0;background:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#E8EEF5;color:var(--text);-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 12px;
}
.phone{
  width:min(430px,100%);height:min(900px,calc(100vh - 48px));
  background:var(--bg);border-radius:28px;overflow:hidden;
  box-shadow:0 24px 80px rgba(29,35,41,.18);display:flex;flex-direction:column;position:relative;
}
.status-bar{
  height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-size:12px;font-weight:600;background:#fff;z-index:5;
}
.nav{
  height:48px;flex:none;display:flex;align-items:center;justify-content:center;
  background:#fff;font-size:16px;font-weight:700;position:relative;z-index:5;
  border-bottom:1px solid #F0F1F3;
}
.nav .back{
  position:absolute;left:8px;top:6px;width:36px;height:36px;font-size:26px;
  color:var(--text);line-height:1;border-radius:50%;transition:transform 120ms var(--ease-press);
}
.nav .back:active{transform:scale(.92)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pad{padding:16px 16px 28px}
.tabbar{
  height:64px;flex:none;display:grid;grid-template-columns:repeat(4,1fr);
  background:#fff;border-top:1px solid #EEF0F2;padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--text3);font-size:11px;
  transition:color 180ms ease,transform 120ms var(--ease-press);
}
.tabbar button:active{transform:scale(.94)}
.tabbar button.active{color:var(--primary);font-weight:700}
.tabbar .ic{font-size:18px;line-height:1}

/* common */
.card{
  background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;
  box-shadow:0 6px 24px rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.02);
  transition:transform 120ms var(--ease-press),box-shadow 220ms var(--ease-enter);
}
.card:active{transform:scale(.985)}
.btn{
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--primary),var(--primary-end));
  color:#fff;font-size:15px;font-weight:600;border-radius:999px;padding:13px 20px;
  box-shadow:0 12px 36px rgba(22,119,255,.2);
  transition:transform 120ms var(--ease-press),opacity 160ms ease,box-shadow 220ms var(--ease-enter);
}
.btn:active{opacity:.92;transform:scale(.97);box-shadow:0 6px 18px rgba(22,119,255,.18)}
.btn.disabled,.btn:disabled{background:#C9CDD4;box-shadow:none;opacity:1;transform:none}
.btn-outline{
  border:1.5px solid var(--primary);color:var(--primary);background:transparent;
  border-radius:999px;padding:11px 18px;font-size:13px;font-weight:600;
  transition:background 160ms ease,transform 120ms var(--ease-press);
}
.btn-outline:active{background:var(--primary-light);transform:scale(.97)}
.btn-sm{
  background:linear-gradient(135deg,var(--primary),var(--primary-end));color:#fff;
  border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;
  transition:transform 120ms var(--ease-press),opacity 160ms ease;
}
.btn-sm:active{transform:scale(.94);opacity:.92}
.tag{
  display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;
  font-size:11px;font-weight:600;background:var(--primary-light);color:var(--primary);
}
.tag.green{background:var(--success-light);color:var(--success)}
.tag.orange{background:#FFF7E6;color:var(--warning)}
.muted{color:var(--text3);font-size:12px;line-height:1.55}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.section-title{
  display:flex;align-items:center;gap:8px;margin:18px 0 12px;font-size:16px;font-weight:700;
}
.section-title::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--primary)}
.enter{animation:rise 360ms var(--ease-enter) both}
.d1{animation-delay:55ms}.d2{animation-delay:110ms}.d3{animation-delay:165ms}

/* 页面差异化入场 — 重要性不同，不要一页一种动画 */
/* 登录：hero 先落，卡片跟上 */
.enter-login{animation:fadeUp 420ms var(--ease-enter) both}
/* 首页：banner 轻微下压展开，内容错落 */
.enter-home{animation:fadeUp 320ms var(--ease-enter) both}
/* 列表/订单/我的：高频页，几乎隐形 */
.enter-quiet{animation:fadeIn 180ms ease both}
/* 详情：hero 横向揭示感 */
.enter-detail{animation:slideIn 300ms var(--ease-move) both}
/* 预约/选场：面板级，不重播卡片 */
.enter-panel{animation:fadeUp 280ms var(--ease-enter) both}
/* 成功：庆祝级 */
.enter-festive{animation:fadeUp 400ms var(--ease-enter) both}

/* 仅首次进入页面时叠加的加载骨架（不是每次交互） */
.first-load{
  animation:fadeIn 160ms ease both;
}
.micro-pop{animation:pop 240ms var(--ease-enter) both}
/* 已选时段：仅首次出现轻入场；换时间不整卡跳 */
.summary-first{animation:fadeUp 220ms var(--ease-enter) both}

/* Apple 风格数字滚轮（odometer）——仅变化的位上下滚动 */
.slot-val{
  display:inline-flex;align-items:center;
  font-variant-numeric:tabular-nums;letter-spacing:.5px;
  color:#111827; /* 更深，保证可读 */
  font-weight:700;
  font-size:15px;
}
.odo-char{
  display:inline-block;
  height:1.35em;
  line-height:1.35em;
  overflow:hidden;
  vertical-align:bottom;
  position:relative;
  color:#111827;
}
.odo-char.odo-static{overflow:visible;height:auto;line-height:inherit}
.odo-strip{
  display:flex;flex-direction:column;
  will-change:transform;
}
.odo-strip > i{
  font-style:normal;
  height:1.35em;
  line-height:1.35em;
  display:block;
  color:#111827;
  font-weight:700;
}
/* 滚动方向：上翻（时间前进）new 从下方进；回退则相反 */
.odo-char.rolling .odo-strip{
  transition:transform 320ms cubic-bezier(0.32, 0.72, 0, 1);
}
.odo-char.rolling-up .odo-strip{transform:translateY(-50%)}
.odo-char.rolling-down .odo-strip{transform:translateY(-50%)}
/* 减弱动效 */
@media (prefers-reduced-motion: reduce){
  .odo-char.rolling .odo-strip{transition:none}
  .summary-first,.val-flip{animation:none}
}
.refresh-spin{animation:spin 700ms linear}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.94)}55%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes ring{
  0%{box-shadow:0 0 0 0 rgba(22,119,255,.45)}
  70%{box-shadow:0 0 0 12px rgba(22,119,255,0)}
  100%{box-shadow:0 0 0 0 rgba(22,119,255,0)}
}
@keyframes checkIn{0%{transform:scale(.4);opacity:0}50%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.86}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:calc(200px + 100%) 0}}

/* home */
.home-top{
  margin:-16px -16px 0;padding:14px 16px 18px;
  background:linear-gradient(180deg,#E6F0FF, #F6F8FB);
}
.search{
  display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;
  padding:8px 8px 8px 16px;border:1px solid rgba(22,119,255,.12);
  box-shadow:0 6px 20px rgba(0,0,0,.04);
  transition:box-shadow 220ms var(--ease-enter),border-color 220ms ease,transform 120ms var(--ease-press);
}
.search.focus{border-color:rgba(22,119,255,.45);box-shadow:0 8px 28px rgba(22,119,255,.16);transform:translateY(-1px)}
.search input{flex:1;min-width:0;border:0;outline:0;font-size:13px;background:transparent}
.banner{
  position:relative;height:150px;border-radius:18px;overflow:hidden;
  background:linear-gradient(135deg,#1677FF,#3B82F6);color:#fff;cursor:pointer;
  box-shadow:0 10px 28px rgba(22,119,255,.16);margin-bottom:14px;
}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:rise 650ms ease-out both}
.banner .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,35,65,.88),rgba(8,35,65,.15))}
.banner .copy{position:relative;z-index:1;padding:20px 22px}
.banner .copy h2{font-size:19px;margin:10px 0 6px;line-height:1.3}
.banner .copy p{font-size:11px;opacity:.92}
.advice{
  border-left:4px solid var(--warning);background:#fff;border-radius:14px;
  padding:14px 16px;box-shadow:0 6px 24px rgba(0,0,0,.04);margin-bottom:8px;
}
.advice strong{display:block;font-size:14px;margin-bottom:6px}
.venue-card{
  display:flex;gap:12px;padding:14px;background:#fff;border-radius:16px;margin-bottom:12px;
  box-shadow:0 6px 24px rgba(0,0,0,.04);cursor:pointer;
  transition:transform 120ms var(--ease-press),box-shadow 220ms var(--ease-enter);
}
.venue-card:active{transform:scale(.985)}
.venue-card img{
  width:92px;height:96px;object-fit:cover;border-radius:12px;flex:none;background:#E5E6EB;
  transition:transform 220ms var(--ease-enter);
}
.venue-card:active img{transform:scale(1.05)}
.venue-card h3{font-size:14px;font-weight:700;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{
  padding:3px 8px;border-radius:6px;background:#F4F6F9;color:var(--text2);font-size:11px;
}
.price{color:#FF4D4F;font-size:20px;font-weight:800}
.price small{color:var(--text3);font-size:11px;font-weight:400}
.pill{
  flex:none;padding:9px 14px;border-radius:999px;border:1px solid #E5E6EB;background:#fff;
  color:var(--text2);font-size:12px;font-weight:600;
  transition:background 220ms var(--ease-enter),color 220ms ease,transform 120ms var(--ease-press),box-shadow 220ms var(--ease-enter);
}
.pill:active{transform:scale(.95)}
.pill.active{
  background:var(--primary);border-color:var(--primary);color:#fff;
  box-shadow:0 6px 18px rgba(22,119,255,.28);transform:scale(1.02);
}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.hscroll::-webkit-scrollbar{display:none}
.slot-mini{
  flex:none;min-width:88px;padding:12px 10px;border-radius:14px;text-align:center;
  background:var(--success-light);border:1.5px solid rgba(0,185,107,.35);color:#087B58;
  transition:transform 120ms var(--ease-press),box-shadow 220ms var(--ease-enter);
}
.slot-mini:active{transform:scale(.95)}
.slot-mini.full{background:#F0F1F3;border-color:#E5E6EB;color:var(--text3)}
.slot-mini strong{display:block;font-size:13px;margin-bottom:3px}

/* list */
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:8px 0 12px}
.filters::-webkit-scrollbar{display:none}
.filter{
  flex:none;padding:9px 14px;border-radius:999px;background:#F4F6F9;color:var(--text2);
  font-size:12px;font-weight:600;
  transition:background 220ms var(--ease-enter),color 220ms ease,transform 120ms var(--ease-press),box-shadow 220ms var(--ease-enter);
}
.filter:active{transform:scale(.95)}
.filter.active{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(22,119,255,.28);transform:scale(1.03)}

/* detail */
.hero{width:calc(100% + 32px);margin:-16px -16px 0;height:200px;object-fit:cover;background:#E5E6EB;display:block}
.detail-title{font-size:21px;font-weight:800;margin:16px 0 8px}
.fact{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #F0F1F3;font-size:13px}
.fact:last-child{border-bottom:0}
.fact span:first-child{color:var(--text2);font-weight:500}
.fact span:last-child{font-weight:600;text-align:right;color:#111827}

/* slots / courts */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cell{
  text-align:center;padding:14px 6px;border-radius:14px;
  background:var(--success-light);border:1.5px solid rgba(0,185,107,.35);color:#087B58;
  transition:transform 120ms var(--ease-press),background 220ms var(--ease-enter),
             border-color 220ms var(--ease-enter),box-shadow 220ms var(--ease-enter);
}
.cell:not(.disabled):active{transform:scale(.95)}
.cell.disabled{background:#F0F1F3;border-color:#E5E6EB;color:var(--text3);cursor:default}
.cell.selected{
  background:var(--primary-light);border-color:var(--primary);color:var(--primary);
  box-shadow:0 10px 28px rgba(22,119,255,.22);transform:scale(1.02);
  animation:pop 280ms var(--ease-enter) both,ring 520ms var(--ease-enter) both;font-weight:600;
}
.cell .t{font-size:15px;font-weight:700}
.cell .s{font-size:11px;margin-top:4px;opacity:.9}

/* form */
.field{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 0;border-bottom:1px solid #F0F1F3;
}
.field:last-child{border-bottom:0}
.field label{color:var(--text3);font-size:13px;flex:none}
.field input{
  border:0;outline:0;text-align:right;font-size:13px;width:65%;background:transparent;color:var(--text);
}

/* success */
.success-icon{
  width:88px;height:88px;border-radius:50%;background:var(--success);color:#fff;
  display:grid;place-items:center;font-size:44px;font-weight:900;margin:0 auto;
  box-shadow:0 8px 24px rgba(0,185,107,.3);animation:checkIn 560ms var(--ease-enter) both;position:relative;
}
.success-icon::before{
  content:"";position:absolute;inset:-10px;border-radius:50%;
  border:3px solid rgba(0,185,107,.35);animation:pulse 1.8s ease-in-out .35s 2;
}
.ticket{
  background:#fff;border-radius:22px;padding:18px;box-shadow:0 6px 24px rgba(0,0,0,.04);
  position:relative;animation:rise 480ms var(--ease-enter) 180ms both;
}
.qr{
  width:180px;height:180px;margin:12px auto;background:
    repeating-conic-gradient(#1D2129 0 25%, #fff 0 50%) 0 0/20px 20px;
  border-radius:8px;border:8px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.08);
}
.dash{height:1px;margin:16px 0;background:repeating-linear-gradient(90deg,#E5E6EB 0 6px,transparent 6px 12px)}

/* orders */
.order-tabs{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding:4px 0 12px}
.order-tabs::-webkit-scrollbar{display:none}
.order-tabs button{
  white-space:nowrap;padding:6px 2px;color:var(--text2);font-size:13px;
  border-bottom:2px solid transparent;transition:color 180ms ease,transform 120ms var(--ease-press);
}
.order-tabs button:active{transform:scale(.96)}
.order-tabs button.active{color:var(--primary);border-color:var(--primary);font-weight:700}

/* profile */
.profile-head{
  margin:-16px -16px 0;padding:28px 16px 22px;color:#fff;
  background:linear-gradient(135deg,#1677FF,#20A6B4);
}
.avatar{
  width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.28);
  display:grid;place-items:center;font-size:24px;
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px;text-align:center}
.stats strong{display:block;font-size:20px}
.stats span{font-size:11px;opacity:.9}
.menu-row{
  width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:14px 0;border-bottom:1px solid #F0F1F3;font-size:14px;text-align:left;
  transition:transform 120ms var(--ease-press),opacity 160ms ease;
}
.menu-row:last-child{border-bottom:0}
.menu-row:active{transform:scale(.98);opacity:.85}

/* login */
.login-hero{
  margin:-16px -16px 18px;padding:48px 24px 36px;
  background:linear-gradient(160deg,#1677FF 0%,#3B82F6 55%,#60A5FA 100%);
  color:#fff;border-radius:0 0 28px 28px;
}
.login-hero h1{font-size:26px;margin:12px 0 8px}
.login-hero p{opacity:.92;font-size:13px;line-height:1.6}
.login-card input{
  width:100%;border:0;background:#F4F6F9;border-radius:12px;padding:14px 16px;
  margin-bottom:12px;font-size:14px;outline:0;
  transition:box-shadow 180ms ease,background 180ms ease;
}
.login-card input:focus{background:#fff;box-shadow:0 0 0 2px rgba(22,119,255,.35)}

/* toast */
.toast{
  position:absolute;left:50%;top:18%;transform:translateX(-50%) translateY(-8px);
  background:rgba(29,35,41,.88);color:#fff;padding:12px 18px;border-radius:12px;
  font-size:13px;opacity:0;pointer-events:none;transition:opacity 220ms ease,transform 220ms var(--ease-enter);
  z-index:50;max-width:80%;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{padding:48px 12px;text-align:center;color:var(--text3);font-size:13px}

/* 骨架屏：仅首次进入页面时出现 */
.sk{
  height:12px;border-radius:6px;margin:0 0 8px;
  background:linear-gradient(90deg,#F0F2F5 25%,#E6E8EB 37%,#F0F2F5 63%);
  background-size:400% 100%;
  animation:shimmer 1.4s ease infinite;
}

/* Tab 图标：线性 SVG，对齐 Sportica 类运动预约 App */
.tabbar .ic{width:22px;height:22px;display:block}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.active svg{stroke:var(--primary)}
.tabbar .ic-refresh{display:inline-block;margin-right:2px}
.refresh-spin .ic-refresh,.refresh-spin{animation:spin 700ms linear}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
  .btn:active,.btn-outline:active,.btn-sm:active,.venue-card:active,.cell.selected,.pill.active{transform:none}
}
</style>
</head>
<body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

<div class="phone" id="phone">
  <div class="status-bar"><span>09:41</span><span>5G · 100%</span></div>
  <div class="nav" id="nav"></div>
  <div class="scroll" id="scroll"><div class="pad" id="content"></div></div>
  <nav class="tabbar" id="tabbar"></nav>
  <div class="toast" id="toast"></div>
</div>

<script>
const venues = [
  {id:1,name:'星羽羽毛球馆 (A馆)',type:'羽毛球',address:'文体中心综合馆 2层 B区',price:35,remain:8,hours:'08:00-22:00',image:'https://images.unsplash.com/photo-1626224583764-f87db24ac4ea?w=800',facilities:['中央空调','专业照明','更衣淋浴'],desc:'国家级比赛标准木地板与专业防滑地胶，配备无影 LED 运动照明和恒温空调。'},

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = (msg) => {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1800);
};

/** 动效调度：仅首次进入播放入场；页内交互只用微动效（ui-animation） */
function animClass(name, kind){
  if (S.motion === 'micro') return '';
  if (S.motion === 'none') return '';
  if (!S.entered[name]) return kind;
  return '';
}
function beginPage(name){
  // go() 设 motion=enter 且未 entered → 播放入场并标记
  S._pageName = name;
}
function finishEnter(name){
  S.entered[name] = true;
  S.motion = 'none';
}

function venueCard(v, i=0){
  const cls = animClass('home','enter-home') || animClass('list','enter-quiet') || '';
  const delay = cls && S.motion==='enter' ? `style="animation-delay:${Math.min(i,5)*55}ms"` : '';
  return `<article class="venue-card ${cls}" ${delay} onclick="openVenue(${v.id})">
    <img src="${v.image}" alt="${esc(v.name)}" />
    <div style="min-width:0;flex:1;display:flex;flex-direction:column">
      <h3 class="truncate">${v.name}</h3>
      <div class="muted truncate">${v.address}</div>
      <div class="chips">${v.facilities.slice(0,3).map(f=>`<span class="chip">${f}</span>`).join('')}</div>
      <div class="between" style="margin-top:auto">
        <div class="price">¥${v.price}<small>/小时起</small></div>
        <button class="btn-sm" onclick="event.stopPropagation();startBooking(${v.id})">立即预约</button>
      </div>
    </div>
  </article>`;
}

/** 时间段文案：10:00 - 11:00 */
function timeText(slot){
  const end = String(Number(slot.slice(0,2))+1).padStart(2,'0') + ':00';
  return `${slot} - ${end}`;
}

/** 把字符串拆成可滚动的字符 DOM（静态字符不动） */
function mountOdometer(root, text){
  root.innerHTML = text.split('').map((ch, i) =>
    `<span class="odo-char odo-static" data-i="${i}" data-ch="${ch}"><span class="odo-strip"><i>${ch}</i></span></span>`
  ).join('');
}

/**
 * Apple 风格数字滚轮：仅变化的位上下滚动
 * timeAdvancing: 新时间更晚 → 旧字上移、新字从下方进；回退则相反
 */
function rollOdometer(root, oldText, newText, timeAdvancing){
  const len = Math.max(oldText.length, newText.length);
  const oldP = oldText.padStart(len, ' ').split('');
  const newP = newText.padStart(len, ' ').split('');
  let delay = 0;

  for (let i = 0; i < len; i++) {
    const o = oldP[i] || ' ';
    const n = newP[i] || ' ';
    const cell = root.querySelector(`[data-i="${i}"]`);
    if (!cell) continue;

    if (o === n) continue;

    // 数字位才滚；冒号/短横保持瞬切（更干净）
    if (!/\d/.test(o) && !/\d/.test(n)) {
      cell.innerHTML = `<span class="odo-strip"><i>${n}</i></span>`;
      cell.dataset.ch = n;
      continue;
    }

    // 结构：[old, new] 一条 strip，按方向 translateY
    // 上翻（前进）：strip 里 old 在上、new 在下，滚到 -50% → new 露出
    // 下翻（回退）：new 在上、old 在下，初始 -50%，滚到 0 → new 露出
    const goingUp = timeAdvancing;
    const html = goingUp
      ? `<span class="odo-strip"><i>${o}</i><i>${n}</i></span>`
      : `<span class="odo-strip"><i>${n}</i><i>${o}</i></span>`;

    cell.classList.remove('odo-static');
    cell.classList.add('rolling', goingUp ? 'rolling-up' : 'rolling-down');
    cell.innerHTML = html;
    cell.dataset.ch = n;

    const strip = cell.querySelector('.odo-strip');
    if (!goingUp) {
      // 回退：先停在上半（显示 old 在下半...）—— 简化：两种方向都用「新字滑入」
      // 回退时 new 在上：从 -50%（露 old）滚到 0（露 new）
      strip.style.transform = 'translateY(-50%)';
    } else {
      strip.style.transform = 'translateY(0)';
    }

    // 轻微错峰，苹果卷轴手感（每位 +12ms，总时长仍 < 300ms + 12*n）
    const d = Math.min(delay, 60);
    delay += 12;

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        strip.style.transitionDelay = d + 'ms';
        strip.style.transform = goingUp ? 'translateY(-50%)' : 'translateY(0)';
      });
    });

    // 动画结束后固化为静态单字符
    setTimeout(() => {
      cell.classList.remove('rolling', 'rolling-up', 'rolling-down');
      cell.classList.add('odo-static');
      cell.innerHTML = `<span class="odo-strip"><i>${n}</i></span>`;
    }, 360 + d);
  }
}

/** 已选时段摘要：仅首次出现 fade-up；换时间不整卡跳跃 */
function summaryAnimClass(){
  if (S._summaryFirst) {
    S._summaryFirst = false;
    return 'summary-first';
  }
  return '';
}

function selectSlot(t){
  const firstSummary = !S.slot && !!t;
  const prev = S.slot;
  S.slot=t;
  // 格子 CSS selection-pop；摘要卡仅首次出现；时间段用数字滚轮
  S.motion = 'none';
  S._summaryFirst = firstSummary;
  render();

  const val = document.getElementById('slotVal');
  if (!val) return;

  if (firstSummary || !prev) {
    mountOdometer(val, timeText(t));
    return;
  }
  if (prev === t) return;

  // 时间前进还是回退：比 start HH
  const advancing = Number(t.slice(0,2)) >= Number(prev.slice(0,2));
  // render() 已用新文案重绘，需要先恢复旧文案再滚到新文案
  mountOdometer(val, timeText(prev));
  requestAnimationFrame(() => {
    rollOdometer(val, timeText(prev), timeText(t), advancing);
  });
}
function selectCourt(n){
  S.court=n;
  S.motion='micro';
  render();
}
function refreshSlots(){
  const btn=document.querySelector('[data-act="refresh-slots"]');
  if(btn){ btn.classList.add('refresh-spin'); setTimeout(()=>btn.classList.remove('refresh-spin'),720); }
  S.motion='none';
  render();
  toast('已刷新时段余量（预览模拟）');
  // TODO(backend): GET /venues/:id/slots?date=today 刷新真实库存
}
function doLogin(wx){
  S.loggedIn=true;
  toast(wx?'微信登录成功':'登录成功');
  go('首页');
}
function logout(){
  S.loggedIn=false;
  toast('已退出登录');
  go('登录');
}
function submitBooking(){
  if(!S.form.sid||!S.form.name||!S.form.phone){ toast('请填写完整联系方式'); return; }
  const order={
    id:'BK'+Date.now().toString().slice(-10),
    status:'待使用',
    venue:S.venue,
    date:new Date().toLocaleDateString('sv-SE'),
    time:`${S.slot}-${String(Number(S.slot.slice(0,2))+1).padStart(2,'0')}:00`,
    court:S.court,
    price:S.venue.price
  };
  S.orders.unshift(order);
  toast('支付成功');
  setTimeout(()=>go('预约成功'),200);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'go') {
    if (el.disabled) return;
    go(el.dataset.page);
  } else if (act === 'select-slot') {
    if (el.dataset.disabled === '1') {
      toast(el.dataset.reason === 'past' ? '该时段已过，不可预约' : '该时段已满');
      return;
    }
    selectSlot(el.dataset.t);
  } else if (act === 'select-court') {
    if (el.dataset.disabled === '1') { toast('该场地已被占用'); return; }
    selectCourt(Number(el.dataset.no));
  } else if (act === 'quick-slot') {
    if (el.dataset.full === '1') { toast('该时段已满'); return; }
    startBooking(Number(el.dataset.venue));
  } else if (act === 'refresh-slots') {
    refreshSlots();
  }
});

  const page=S.page;
  const isRoot=rootTabs.includes(page);
  $('nav').innerHTML=`${isRoot||page==='登录'?'':'<button class="back" aria-label="返回" onclick="goBack()">‹</button>'}${

  }`;
  const views={
    '登录':pageLogin,'首页':pageHome,'场地':pageList,'场馆详情':pageDetail,
    '选择时间':pageBooking,'选场地':pageCourt,'填写信息':pageFill,
    '预约成功':pageSuccess,'订单':pageOrders,'我的':pageProfile
  };
  $('content').innerHTML=(views[page]||pageHome)();
  $('tabbar').innerHTML=['首页','场地','订单','我的'].map((t)=>{
    const show=!( !S.loggedIn && page==='登录');
    return show?`<button class="${page===t?'active':''}" onclick="go('${t}')">
      <span class="ic">${TAB_ICONS[t]||''}</span>${t}</button>`:'';
  }).join('');
  // 首次入场动画播完后标记，之后同页交互不再重播
  if (S.motion === 'enter') {
    S.entered[page] = true;
    S.motion = 'none';
  }
}
